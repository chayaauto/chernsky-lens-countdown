:root{
  --ink:#EFECE4;      /* off-white: never pure white on a plasma */
  --dim:#9E9A90;
  --amber:#FFC23D;
  --gold1:#F6E7C1; --gold2:#D9B26A;
  --green:#3BE07A;
  --red:#FF453A;
  --f:"RB","Rubik","Arial Hebrew",Arial,sans-serif;
  --m:"MONO","Share Tech Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:var(--f)}
body.nocursor{cursor:none}
#world{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%}
#drift{position:absolute;inset:0;will-change:transform}

/* ---------- live-view guides ---------- */
#grid{position:absolute;inset:0;pointer-events:none;opacity:.16}
#grid i{position:absolute;background:var(--ink)}
#grid i:nth-child(1){left:640px;top:150px;width:2px;height:780px}
#grid i:nth-child(2){left:1280px;top:150px;width:2px;height:780px}
#grid i:nth-child(3){left:120px;top:360px;width:1680px;height:2px}
#grid i:nth-child(4){left:120px;top:720px;width:1680px;height:2px}
.corner{position:absolute;width:56px;height:56px;border:0 solid rgba(239,236,228,.55)}
.c1{left:56px;top:136px;border-left-width:3px;border-top-width:3px}
.c2{right:56px;top:136px;border-right-width:3px;border-top-width:3px}
.c3{left:56px;bottom:136px;border-left-width:3px;border-bottom-width:3px}
.c4{right:56px;bottom:136px;border-right-width:3px;border-bottom-width:3px}

/* ---------- HUD ---------- */
.hud{position:absolute;left:56px;right:56px;height:72px;display:flex;align-items:center;gap:34px;font-family:var(--m);font-size:38px;color:var(--ink);opacity:.82}
#hudTop{top:40px}
#hudBot{bottom:36px}
.hud .sp{flex:1}
.box{border:2px solid var(--ink);padding:0 12px;border-radius:6px;line-height:52px}
.val{min-width:2ch;display:inline-block}
.lab-s{font-size:22px;color:var(--dim);margin-inline-end:8px}
#rec{display:flex;align-items:center;gap:12px;color:var(--red)}
#rec b{width:24px;height:24px;border-radius:50%;background:var(--red);display:block}
#meter{position:relative;width:330px;height:46px}
#meter .scale{position:absolute;left:0;right:0;top:24px;height:2px;background:var(--ink)}
#meter .tk{position:absolute;top:16px;width:2px;height:18px;background:var(--ink)}
#meter .tk.big{top:10px;height:30px}
#meter .num{position:absolute;top:-10px;font-size:18px;transform:translateX(-50%);color:var(--dim)}
#needle{position:absolute;left:165px;top:30px;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:16px solid var(--amber);margin-left:-11px;will-change:transform}
#battery{display:flex;align-items:center;gap:12px}
#bat{position:relative;width:96px;height:44px;border:3px solid var(--ink);border-radius:7px;padding:4px;display:flex;gap:4px}
#bat::after{content:"";position:absolute;right:-11px;top:12px;width:7px;height:14px;background:var(--ink);border-radius:0 3px 3px 0}
#bat i{flex:1;background:var(--green);border-radius:2px;opacity:.15}
#bat i.on{opacity:1}
#bolt{width:22px;height:36px;color:var(--amber)}
#batPct{font-size:32px}
#card{display:flex;align-items:center;gap:10px}
#card svg{width:30px;height:38px}
#histo{width:240px;height:70px;border-bottom:2px solid rgba(239,236,228,.6)}
#level{position:relative;width:240px;height:40px}
#level i{position:absolute;left:0;right:0;top:19px;height:3px;background:var(--ink);will-change:transform}
#level b{position:absolute;left:50%;top:6px;width:3px;height:28px;margin-left:-1px;background:var(--green)}
#tc{letter-spacing:.04em}

/* ---------- AF points ---------- */
#af{display:none;position:absolute;left:330px;top:300px;width:1260px;height:480px;pointer-events:none}
#af i{position:absolute;width:44px;height:30px;border:2px solid rgba(239,236,228,0);border-radius:3px;transition:border-color .25s,background-color .25s}
#af i.hit{border-color:rgba(239,236,228,.9)}
#af i.ok{border-color:var(--green);background:rgba(59,224,122,.12)}

/* main focus frame around the countdown */
#frame{position:absolute;left:300px;top:335px;width:1320px;height:410px;pointer-events:none;will-change:transform}
#frame i{position:absolute;width:80px;height:80px;border:0 solid var(--ink);transition:border-color .2s}
#frame i:nth-child(1){left:0;top:0;border-left-width:6px;border-top-width:6px}
#frame i:nth-child(2){right:0;top:0;border-right-width:6px;border-top-width:6px}
#frame i:nth-child(3){left:0;bottom:0;border-left-width:6px;border-bottom-width:6px}
#frame i:nth-child(4){right:0;bottom:0;border-right-width:6px;border-bottom-width:6px}
#frame.lock i{border-color:var(--green)}
#afLabel{position:absolute;left:300px;top:286px;font:400 28px var(--m);color:var(--green);opacity:0}

/* ---------- main text ---------- */
#main{position:absolute;inset:0;direction:rtl;pointer-events:none}
#line1{position:absolute;left:0;right:0;top:168px;display:flex;justify-content:center;gap:34px;font-weight:500;font-size:60px;color:var(--ink)}
#line1 .ph{display:inline-block;position:relative;will-change:transform}
#line1 .ch{display:inline;opacity:0}
#line1 .ph::before{content:"";position:absolute;inset:-6px -18px -2px;border:3px solid var(--green);border-radius:6px;opacity:0;transform:scale(1.25);transition:opacity .18s,transform .25s cubic-bezier(.2,.9,.3,1.3)}
#line1 .ph.af::before{opacity:1;transform:scale(1)}
#line1 .caret{display:inline-block;width:.09em;height:.9em;background:var(--amber);vertical-align:-.08em;margin:0 .04em;opacity:0}
#line1 .dot{color:var(--amber)}
#line1 .ch.gl{color:#FFE3A0}
#before .w{display:inline-block;will-change:transform,opacity}
#before .lt{display:inline-block;will-change:transform}
#before .chev{display:inline-flex;flex-direction:column;align-items:center;margin:0 30px;vertical-align:middle;height:70px;justify-content:center}
#before .chev i{display:block;width:24px;height:24px;border-right:5px solid var(--amber);border-bottom:5px solid var(--amber);transform:rotate(45deg);margin:-9px 0;opacity:.2}
#before{position:absolute;left:0;right:0;top:262px;text-align:center;will-change:transform,opacity;font-weight:400;font-size:54px;color:var(--dim)}
#count{position:absolute;left:300px;width:1320px;top:345px;height:390px;display:flex;justify-content:center;align-items:center;gap:40px}
.u{display:flex;flex-direction:column;align-items:center;min-width:200px}
.u .n{font-weight:700;font-size:210px;line-height:.92;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  background:linear-gradient(180deg,var(--gold1),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;will-change:transform,opacity}
.u .l{font-weight:500;font-size:46px;color:var(--ink);margin-top:10px}
.u.sm .n{font-size:150px;margin-top:30px}
.u.sm .l{font-size:38px;color:var(--dim)}
/* hours:minutes:seconds read left to right like a clock; weeks/days read right to left with the sentence */
.clock{display:flex;direction:ltr;align-items:flex-start;gap:10px}
.clock .u{min-width:0}
.colon{font-weight:700;font-size:120px;line-height:1;margin-top:38px;color:#C9A866;opacity:.3}
/* the colons light up together with the new seconds digit (started in the same frame as its roll, same easing) */
.colon.beat{animation:beat 1s cubic-bezier(.2,.8,.2,1)}
@keyframes beat{0%{opacity:.3}14%{opacity:.95}55%{opacity:.95}75%{opacity:.3}100%{opacity:.3}}
#count.lastday .u.sm .n{font-size:230px;margin-top:0}
#count.lastday .colon{font-size:180px;margin-top:20px}
/* two rows: weeks + days on top (read right to left), the clock centred below (read left to right) */
#count{flex-wrap:wrap;align-content:center;row-gap:6px;column-gap:90px;top:335px;height:420px}
#count > .u .n{font-size:178px}
#count > .u .l{font-size:42px;margin-top:4px}
#count .sep{display:none}
#count .clock{flex-basis:100%;justify-content:center}
#count:not(.lastday) .u.sm .n{font-size:118px;margin-top:0}
#count:not(.lastday) .u.sm .l{font-size:32px;margin-top:2px}
#count:not(.lastday) .colon{font-size:96px;margin-top:6px}
.sep{width:3px;height:190px;background:rgba(239,236,228,.22);align-self:center;margin-top:-50px}
.n.roll{animation:roll .42s cubic-bezier(.2,.8,.2,1)}
@keyframes roll{0%{transform:translateY(-34%);opacity:0}100%{transform:none;opacity:1}}
#sentence{position:absolute;left:0;right:0;top:770px;display:flex;justify-content:center;gap:28px;font-weight:800;font-size:100px;line-height:1.1}
#sentence span{display:inline-block;color:transparent;-webkit-background-clip:text;background-clip:text;background-repeat:no-repeat;
  background-image:linear-gradient(100deg,#EFECE4 0%,#EFECE4 44%,#FFE3A0 49%,#FFFFFF 50%,#FFE3A0 51%,#EFECE4 56%,#EFECE4 100%);will-change:transform,opacity}
#sentence span.hl{background-image:linear-gradient(#FFC23D,#FFC23D)}

/* ---------- moments ---------- */
#blackout{position:absolute;inset:-40px;background:#000;opacity:0;pointer-events:none}
#flash{position:fixed;inset:0;background:#FFF6E6;opacity:0;pointer-events:none}
#review{position:absolute;inset:0;pointer-events:none;opacity:0}
#review .rframe{position:absolute;left:150px;top:140px;right:150px;bottom:140px;border:4px solid var(--ink);border-radius:8px}
#review .rtag{position:absolute;left:170px;top:156px;font:400 34px var(--m);color:var(--ink);background:rgba(0,0,0,.7);padding:4px 14px;border-radius:6px}
#review .rok{position:absolute;right:170px;bottom:156px;font-weight:700;font-size:44px;color:var(--green);direction:rtl;background:rgba(0,0,0,.7);padding:6px 18px;border-radius:8px}
#charge{position:absolute;left:760px;top:1050px;width:400px;height:12px;border:2px solid var(--amber);border-radius:6px;opacity:0;overflow:hidden}
#charge i{display:block;height:100%;width:100%;background:var(--amber);transform-origin:0 50%;transform:scaleX(0)}
#selfTimer{position:absolute;left:0;right:0;top:968px;display:flex;justify-content:center;align-items:center;gap:22px;direction:ltr;opacity:0;font:400 52px var(--m);color:var(--ink)}
#selfTimer svg{width:56px;height:56px}
#lamp{width:30px;height:30px;border-radius:50%;background:#5a1410;box-shadow:0 0 0 3px rgba(239,236,228,.5)}
#lamp.on{background:#FF5A3C;box-shadow:0 0 0 3px rgba(239,236,228,.8),0 0 28px 8px rgba(255,90,60,.55)}
#prep{position:absolute;left:0;right:0;top:952px;text-align:center;direction:rtl;font-weight:700;font-size:40px;color:var(--amber);opacity:0}


#night{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 60s linear}
#mute{position:fixed;left:28px;bottom:120px;font-size:28px;color:rgba(239,236,228,.5);display:none}

#expired{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;text-align:center;padding:40px;direction:rtl}
body.expired #expired{display:flex}
#expired h2{font-weight:700;font-size:64px;margin:0 0 20px;color:#8C877C}
#expired p{font-size:30px;margin:0;color:#77736a}
#expired a{color:#a8916a}
#soundHint{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);font:600 24px var(--f);color:#000;background:var(--amber);padding:10px 22px;border-radius:999px;display:none;direction:rtl;cursor:pointer;z-index:5}
#mBox{cursor:pointer;position:relative;pointer-events:auto}
body.muted #mBox,body.needsound #mBox{color:var(--dim);border-color:var(--dim)}

#demoCap{position:fixed;right:28px;bottom:130px;font:600 24px var(--f);color:rgba(239,236,228,.8);background:rgba(40,40,40,.8);padding:8px 18px;border-radius:10px;direction:rtl;display:none;z-index:5}
body.demo.playing #demoCap{display:flex}
#demoCap{align-items:center;gap:18px;overflow:hidden}
#demoCap button{font:600 22px var(--f);background:none;color:var(--amber);border:2px solid var(--amber);border-radius:8px;padding:4px 14px;cursor:pointer}
#demoBar{position:absolute;left:0;bottom:0;height:4px;background:var(--amber);width:0}
/* demo menu, styled like a camera's settings menu */
#menu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);z-index:10;direction:rtl}
body.demo.menu #menu{display:flex}
#menuBox{width:min(980px,92vw);background:#0d0d0f;border:2px solid #3a3833;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.7);overflow:hidden}
#menuHead{display:flex;align-items:center;gap:16px;padding:22px 30px;border-bottom:2px solid #2a2925;font:700 32px var(--f);color:var(--ink)}
#menuHead .tag{font:400 22px var(--m);color:#000;background:var(--amber);border-radius:6px;padding:2px 10px;direction:ltr}
#menuHead .sub{margin-inline-start:auto;font:400 20px var(--f);color:var(--dim)}
#menuList{list-style:none;margin:0;padding:12px}
#menuList li{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:18px;padding:16px 20px;border-radius:12px;cursor:pointer;border:2px solid transparent}
#menuList li .ic{font:400 26px var(--m);color:var(--amber);text-align:center;direction:ltr}
#menuList li b{display:block;font:700 30px var(--f);color:var(--ink)}
#menuList li span.d{display:block;font:400 21px var(--f);color:var(--dim);margin-top:2px}
#menuList li .t{font:400 22px var(--m);color:var(--dim);direction:ltr}
#menuList li.sel,#menuList li:hover{background:#1c1b18;border-color:var(--amber)}
#menuList li.sel .t,#menuList li:hover .t{color:var(--amber)}
#menuFoot{padding:14px 30px 20px;font:400 19px var(--f);color:var(--dim);border-top:2px solid #2a2925}
</style>
</head>

const form = (k, v) => FORMS[k][v === 1 ? 0 : 1];

/* ================= HUD build ================= */
(function buildMeter(){
  let s = '<div class="scale"></div>';
  for (let i = -3; i <= 3; i++) { const x = 165 + i * 50; s += '<div class="tk big" style="left:' + (x - 1) + 'px"></div><div class="num" style="left:' + x + 'px">' + (i === 0 ? "0" : Math.abs(i)) + '</div>'; if (i < 3) for (let j = 1; j < 3; j++) s += '<div class="tk" style="left:' + (x + j * 16.6 - 1) + 'px"></div>'; }

})();

  const cols = 15, rows = 7;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const i = document.createElement("i"); i.style.left = (c * 87) + "px"; i.style.top = (r * 72) + "px";

function ac(){
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx.state === "suspended") actx.resume();

}
function noiseBuf(c, dur){ const b = c.createBuffer(1, Math.ceil(c.sampleRate * dur), c.sampleRate), a = b.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; return b; }

  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .02);
}
const CUSTOM = {
  shutterClick(v){ const c = ac(); if (!c) return; const t = c.currentTime + .01;   // loud DSLR shutter with flash pop: "ka-CHUNK"
    const out = c.createDynamicsCompressor(); out.threshold.value = -20; out.knee.value = 4; out.ratio.value = 10; out.attack.value = .001; out.release.value = .12;

    const dl = c.createDelay(); dl.delayTime.value = .07; const fb = c.createGain(); fb.gain.value = .32;      // short hallway echo
    const wet = c.createGain(); wet.gain.value = .35; out.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(c.destination);
    const nz = (at, dur, type, freq, q, peak, decay) => { const s = c.createBufferSource(); s.buffer = noiseBuf(c, dur);
      const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
      const e = c.createGain(); e.gain.setValueAtTime(0.0001, at); e.gain.exponentialRampToValueAtTime(peak, at + .002); e.gain.exponentialRampToValueAtTime(0.0001, at + decay);
      s.connect(f); f.connect(e); e.connect(out); s.start(at); s.stop(at + dur + .02); };
    const sn = (at, dur, f0, f1, peak) => { const o = c.createOscillator(); o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + dur);
      const e = c.createGain(); e.gain.setValueAtTime(0.0001, at); e.gain.exponentialRampToValueAtTime(peak, at + .003); e.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      o.connect(e); e.connect(out); o.start(at); o.stop(at + dur + .02); };
    nz(t, .03, "highpass", 2500, .7, .9, .03);            // flash "pop"

    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 2.45); },
  stBeep(v, k){ const c = ac(); if (!c) return; const t = c.currentTime + .005;   // Canon-like self-timer beep; k = 0..1 tension (pitch and loudness rise)

/* ================= demo: ?demo=1 (or #demo) opens a menu of situations; ?demo=<id> plays one ================= */
const DEMO = [
  ["timer",   "טיימר רגיל",                    "2026-11-10T12:20:00", 20000, "◉",  "כך המסך נראה רוב היום: טקסט מתחלף, פוקוס ננעל, שניות רצות"],
  ["hourly",  "צילום בכל שעה עגולה בטיימר",      "2026-11-12T14:08:42", 24000, "⏱", "כשהטיימר מגיע לשעה עגולה (00:00): נעילת פוקוס, טיימר עצמי, פלאש וקליק"],
  ["morning", "צילום הבוקר ב-8:09",              "2026-11-12T08:08:42", 24000, "☀", "אותו רגע צילום, כל בוקר דקה לפני הצלצול"],
  ["lastday", "היממה האחרונה",                 "2026-12-02T15:30:00", 14000, "24", "ביממה האחרונה השעון גדל ותופס את כל השורה"]
];
let demoTimer = 0, demoIdx = 0, demoChain = false, demoStart = 0, menuSel = 0, menuOpen = false;
function resetBoard(){
  state = "board"; document.body.classList.remove("expired");
  ["blackout","flash","review","charge","prep","selfTimer"].forEach(id => css($(id), "opacity", "0"));
  for (const k in fired) delete fired[k];
  frozen = false; shown = {}; renderTimer(true);
}
function buildMenu(){
  const items = DEMO.map((d, i) => ({ i, ic: d[4], name: d[1], desc: d[5], dur: Math.round(d[3] / 1000) + "s" }));
  items.push({ i: -1, ic: "▶▶", name: "הכול ברצף", desc: "כל המצבים אחד אחרי השני, ואז חזרה לתפריט", dur: Math.round(DEMO.reduce((a, d) => a + d[3], 0) / 1000) + "s" });
  $("menuList").innerHTML = items.map((it, n) => '<li data-i="' + it.i + '" data-n="' + n + '"><span class="ic">' + it.ic + '</span><span><b>' + it.name + '</b><span class="d">' + it.desc + '</span></span><span class="t">' + it.dur + '</span></li>').join("");
  [...$("menuList").children].forEach(li => {
    li.addEventListener("click", () => startFromMenu(+li.dataset.i));
    li.addEventListener("mouseenter", () => selectMenu(+li.dataset.n));
  });
}
function selectMenu(n){ const li = [...$("menuList").children]; menuSel = (n + li.length) % li.length; li.forEach((x, k) => x.classList.toggle("sel", k === menuSel)); }
function showMenu(){
  clearTimeout(demoTimer); menuOpen = true; demoChain = false;
  document.body.classList.add("menu"); document.body.classList.remove("playing");
  playSceneQuiet(0); selectMenu(menuSel);
}
function startFromMenu(i){
  unlockSound(); menuOpen = false;
  document.body.classList.remove("menu"); document.body.classList.add("playing");
  demoChain = i < 0; playScene(i < 0 ? 0 : i);
}
function playSceneQuiet(i){                     // the live screen behind the menu
  const sc = DEMO[i]; clockOffset = new Date(sc[2]).getTime() - Date.now(); resetBoard();
}
function playScene(i){
  demoIdx = i; const sc = DEMO[i]; clearTimeout(demoTimer);
  clockOffset = new Date(sc[2]).getTime() - Date.now();
  resetBoard();
  if (now() >= EXPIRES_AT.getTime()) showExpired();
  $("demoName").textContent = "הדגמה · " + sc[1] + (demoChain ? "  (" + (i + 1) + "/" + DEMO.length + ")" : "");
  demoStart = performance.now();
  const bar = $("demoBar"); bar.style.transition = "none"; bar.style.width = "0";
  requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = "width " + sc[3] + "ms linear"; bar.style.width = "100%"; }));
  demoTimer = setTimeout(() => { if (demoChain && i + 1 < DEMO.length) playScene(i + 1); else showMenu(); }, sc[3]);
}
// on the web (GitHub Pages) the page is a showcase: it always opens the demo menu; the app on the hallway computer runs the real timer
const ONLINE = /(^|\.)github\.io$/.test(location.hostname);
const demoArg = Q.get("demo") || (location.hash.startsWith("#demo") ? (location.hash.slice(6) || "1") : null) || (ONLINE ? "1" : null);

/* ================= start ================= */
fit();
if (demoArg) {
  document.body.classList.add("demo");
  buildMenu();
  const idx = DEMO.findIndex(d => d[0] === demoArg);
  if (idx >= 0) startFromMenu(idx); else showMenu();
  $("demoBack").addEventListener("click", e => { e.stopPropagation(); showMenu(); });
  addEventListener("keydown", e => {
    if (menuOpen) {
      if (e.key === "ArrowDown") selectMenu(menuSel + 1);
      if (e.key === "ArrowUp") selectMenu(menuSel - 1);
      if (e.key === "Enter") { const li = $("menuList").children[menuSel]; if (li) startFromMenu(+li.dataset.i); }
    } else if (e.key === "Escape") showMenu();
  });
} else {
  if (now() >= EXPIRES_AT.getTime()) showExpired();
  renderTimer(true);
}
rafId = requestAnimationFrame(frame);
</script>
</body>
</html>
